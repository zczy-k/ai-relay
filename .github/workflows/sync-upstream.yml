name: Sync Upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from MoyuFamily/ai-relay
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: MoyuFamily/ai-relay
          upstream_sync_branch: main

          target_sync_branch: main

          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

          upstream_pull_args: '-X ours'
