name: Sync Upstream

on:
  schedule:
    - cron: '*/30 * * * *'     # 每30分钟检查一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from MoyuFamily/ai-relay
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_repository: MoyuFamily/ai-relay
          upstream_branch: main
          target_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_merge_args: '--strategy-option=ours'
